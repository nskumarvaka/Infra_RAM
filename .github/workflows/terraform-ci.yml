name: Terraform CI

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -recursive -check

      - name: Initialize without backend
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Validate remote-state bootstrap
        run: |
          terraform -chdir=bootstrap init -backend=false -input=false
          terraform -chdir=bootstrap validate -no-color

      - name: Checkov security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
          # Some controls are external or not applicable: App Service auth and
          # client certificates are app-specific; Azure Files is incompatible with
          # run-from-package; ADF Git is not managed by this Terraform module; and
          # Checkov 3.4.6 flags the configured ZRS replication. Availability
          # requirements depend on the selected App Service SKU and environment.
          # Ledger is unsupported by the pinned provider; other existing
          # exclusions cover provider gaps or cross-resource controls.
          skip_check: CKV_AZURE_13,CKV_AZURE_17,CKV_AZURE_88,CKV_AZURE_103,CKV_AZURE_206,CKV_AZURE_212,CKV_AZURE_224,CKV_AZURE_225,CKV_AZURE_229,CKV2_AZURE_1,CKV2_AZURE_2,CKV2_AZURE_21,CKV2_AZURE_32,CKV2_AZURE_33,CKV2_AZURE_45
